[project]
name = "btcv-dino-l3r"
python = "/pd/conda_envs/dino/bin/python"
device = "cuda:0"
fixed_test_previously_viewed = true
start_stage = "ocre"
stop_after_stage = "ocre"

[dataset]
name = "btcv"
train_images = "/pd/heyang/BTCV/split/imagesTr"
train_labels = "/pd/heyang/BTCV/split/labelsTr"
test_images = "/pd/heyang/BTCV/split/imagesTs"
test_labels = "/pd/heyang/BTCV/split/labelsTs"
split_manifest = "datasets/btcv/split_manifest.json"
split_sha256 = "cc0177af1eb54de00aadba59e0992ca7cd0c1e9fbacac158e80bf7d30f86d425"
train_cases = 24
test_cases = 6
test_case_ids = ["0006", "0028", "0031", "0032", "0033", "0036"]

[dependencies]
dino_weights = "/pd/heyang/weights/model.safetensors"
clip_model = "/pd/heyang/weights/clip-vit-base-patch32"
dinov3_package = "third_party"

[results]
root = "results/btcv/dino_l3r"
reproduction_root = "results/btcv/dino_l3r_reproduction"

[gsp_dino]
checkpoint = "results/btcv/dino_l3r/gsp_dino/checkpoints/gsp_final.pth"
checkpoint_sha256 = "71e4db77579ae968b8f3fbb65eca94079dcb6d2042682e117556ccdfe28c4fa3"
resume = "results/btcv/dino_l3r/gsp_dino/checkpoints/gsp_resume.pth"
report = "results/btcv/dino_l3r/gsp_dino/reports/training.csv"
train_predictions = "results/btcv/dino_l3r/gsp_dino/predictions/train"
test_predictions = "results/btcv/dino_l3r/gsp_dino/predictions/test"
epochs = 8
samples_per_epoch = 15170
batch_size = 4
inference_batch_size = 4
workers = 4
lr_backbone = 5e-7
lr_backbone_early = 1e-7
lr_backbone_middle = 2e-7
lr_backbone_late = 5e-7
lr_head = 2e-5
trainable_block_start = 6
weight_decay = 1e-4
seed = 42
no_validation = true
early_stopping = false
augmentation_profile = "standard"
balance_cap = 2.5
class_weight_cap = 2.5
background_weight = 0.25
label_smoothing = 0.0
context_mm = 5.0
smooth_sigma = 1.0
sampling_mode = "coverage_balanced"
view_mode = "fixed_multiview"
