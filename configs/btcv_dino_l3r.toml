presence_head = true

[ocre]
checkpoint = "results/btcv/dino_l3r/ocre/checkpoints/ocre_final.pth"
cache = "results/btcv/dino_l3r/ocre/cache"
train_predictions = "results/btcv/dino_l3r/ocre/predictions/train"
