epochs = 24
samples_per_epoch = 2200
batch_size = 4
workers = 4
lr = 1.5e-4
boundary_probability = 0.75
prior_shift_probability = 0.65
prior_shift_max_mm = 3.0
save_every = 1
amp = true
seed = 542
